# Decap CMS configuration.
# Editors save through GitHub commits (Git-based workflow) which trigger a Netlify rebuild.
backend:
  name: github
  repo: OfirTurcan/AutomationPortfolio
  branch: main
  # OAuth handled by the bundled Netlify Functions (/auth, /callback).
  # `base_url` MUST be your live Netlify site origin (no trailing slash).
  base_url: https://ofir-turcan-portfolio.netlify.app
  auth_endpoint: auth

# Lets you edit locally with `npx decap-server` (no GitHub login needed in dev).
local_backend: true

# Uploaded media lands in public/assets and is referenced from the site root as /assets/...
media_folder: public/assets
public_folder: /assets

publish_mode: simple

collections:
  # ---------------------------------------------------------------- Portfolio
  - name: projects
    label: Portfolio
    label_singular: Project
    folder: src/content/projects
    create: true
    format: json
    extension: json
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{title_en}}  —  {{status}}"
    sortable_fields: [order, title_en, status]
    fields:
      - { label: Slug (filename / URL id), name: slug, widget: string, hint: "lowercase, hyphenated. Also the file name." }
      - { label: Title (EN), name: title_en, widget: string }
      - { label: Title (HE), name: title_he, widget: string }
      - { label: Tagline (EN), name: tagline_en, widget: string, required: false }
      - { label: Tagline (HE), name: tagline_he, widget: string, required: false }
      - { label: Description (EN), name: description_en, widget: text }
      - { label: Description (HE), name: description_he, widget: text }
      - { label: Outcome (EN), name: outcome_en, widget: text }
      - { label: Outcome (HE), name: outcome_he, widget: text }
      - { label: Tools, name: tools, widget: list, hint: "Comma-separated list of tool/tech names." }
      - { label: Tags, name: tags, widget: list, hint: "Comma-separated tags." }
      - label: Status
        name: status
        widget: select
        default: live
        options:
          - { label: Live, value: live }
          - { label: In progress, value: in-progress }
          - { label: Prototype, value: prototype }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Order (lower = earlier), name: order, widget: number, required: false, value_type: int }
      - { label: Thumbnail, name: thumbnail, widget: image, hint: "Always shown: it is the card image, and the video's cover when there is a video. Use a 16:9 JPG or WebP, ideally under 200 KB (around 1280×720)." }
      - { label: Video link (YouTube or Vimeo), name: video_url, widget: string, required: false, hint: "Paste the normal link (watch, youtu.be, Shorts, /embed/ or vimeo.com all work). The video only loads when a visitor presses play. Leave empty to show the 'demo on request' note." }
      - { label: Gallery image paths, name: gallery, widget: list, required: false, hint: "Optional. e.g. /assets/shot1.png" }
      - { label: Live link, name: link_live, widget: string, required: false }
      - { label: Repository link, name: link_repo, widget: string, required: false }
      - { label: Case study link, name: link_caseStudy, widget: string, required: false }
      - { label: Highlights (EN), name: highlights_en, widget: list, required: false }
      - { label: Highlights (HE), name: highlights_he, widget: list, required: false }

  # ------------------------------------------------------------ Testimonials
  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: src/content/testimonials
    create: true
    format: json
    extension: json
    identifier_field: slug
    slug: "{{fields.slug}}"
    summary: "{{name_he}}  —  {{rating}}/5"
    sortable_fields: [order, rating, name_he, published]
    fields:
      - { label: Slug (filename / id), name: slug, widget: string, hint: "lowercase, hyphenated (e.g. dana-cohen). Also the file name." }
      - { label: Customer name (HE), name: name_he, widget: string }
      - { label: Customer name (EN), name: name_en, widget: string, required: false, hint: "Optional. Falls back to the Hebrew name." }
      - { label: Role / company (HE), name: role_he, widget: string, required: false, hint: "e.g. CEO, Example Ltd" }
      - { label: Role / company (EN), name: role_en, widget: string, required: false }
      - { label: Rating (1-5 stars), name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { label: Quote (HE), name: quote_he, widget: text }
      - { label: Quote (EN), name: quote_en, widget: text, required: false, hint: "Optional. English visitors see the Hebrew quote if empty." }
      - { label: Photo, name: photo, widget: image, required: false, hint: "Optional customer photo. Use a small image (under ~300 KB). If there is a video, the photo becomes the video's cover." }
      - { label: Video link (YouTube or Vimeo), name: video_url, widget: string, required: false, hint: "Optional 1-3 minute clip. Upload it to YouTube (Unlisted) or Vimeo, then paste the normal link here (watch link, youtu.be link or vimeo.com link all work). The video only loads when a visitor presses play." }
      - { label: Featured (shown first), name: featured, widget: boolean, default: false }
      - { label: Published, name: published, widget: boolean, default: true, hint: "Untick to hide it from the site without deleting it." }
      - { label: Order (lower = earlier), name: order, widget: number, required: false, value_type: int }

  # ----------------------------------------------------------------- Settings
  - name: site
    label: Site Content
    files:
      # ------------------------------------------------------- Cookies & analytics
      - name: cookies
        label: Cookies & analytics
        file: src/content/cookies.json
        format: json
        fields:
          - { label: Google Analytics 4 measurement ID, name: ga4_id, widget: string, required: false, hint: "e.g. G-XXXXXXXXXX. Leave empty for none. When an ID is set, first-time visitors see a small consent bar and the tool loads only after they allow measurement. Also update the measurement description below and the privacy policy." }
          - { label: Microsoft Clarity project ID, name: clarity_id, widget: string, required: false, hint: "Leave empty for none. Same consent rules as Google Analytics." }
          - { label: "Panel title (HE)", name: ck_title_he, widget: string }
          - { label: "Panel title (EN)", name: ck_title_en, widget: string }
          - { label: "Panel intro (HE)", name: ck_intro_he, widget: text }
          - { label: "Panel intro (EN)", name: ck_intro_en, widget: text }
          - { label: "Essential: title (HE)", name: ck_essential_title_he, widget: string }
          - { label: "Essential: title (EN)", name: ck_essential_title_en, widget: string }
          - { label: "Essential: description (HE)", name: ck_essential_desc_he, widget: text }
          - { label: "Essential: description (EN)", name: ck_essential_desc_en, widget: text }
          - { label: 'Essential: "always on" badge (HE)', name: ck_always_on_he, widget: string }
          - { label: 'Essential: "always on" badge (EN)', name: ck_always_on_en, widget: string }
          - { label: "Measurement: title (HE)", name: ck_analytics_title_he, widget: string }
          - { label: "Measurement: title (EN)", name: ck_analytics_title_en, widget: string }
          - { label: "Measurement: description (HE)", name: ck_analytics_desc_he, widget: text }
          - { label: "Measurement: description (EN)", name: ck_analytics_desc_en, widget: text }
          - { label: "Marketing: title (HE)", name: ck_marketing_title_he, widget: string }
          - { label: "Marketing: title (EN)", name: ck_marketing_title_en, widget: string }
          - { label: "Marketing: description (HE)", name: ck_marketing_desc_he, widget: text }
          - { label: "Marketing: description (EN)", name: ck_marketing_desc_en, widget: text }
          - { label: "Consent checkbox text (before the link) (HE)", name: ck_agree_he, widget: string }
          - { label: "Consent checkbox text (before the link) (EN)", name: ck_agree_en, widget: string }
          - { label: "Consent checkbox: privacy link text (HE)", name: ck_agree_link_he, widget: string }
          - { label: "Consent checkbox: privacy link text (EN)", name: ck_agree_link_en, widget: string }
          - { label: "Button: accept all (HE)", name: ck_accept_all_he, widget: string }
          - { label: "Button: accept all (EN)", name: ck_accept_all_en, widget: string }
          - { label: "Button: essential only (HE)", name: ck_reject_he, widget: string }
          - { label: "Button: essential only (EN)", name: ck_reject_en, widget: string }
          - { label: "Button: save choices (HE)", name: ck_save_he, widget: string }
          - { label: "Button: save choices (EN)", name: ck_save_en, widget: string }
          - { label: "Close button (screen readers) (HE)", name: ck_close_he, widget: string }
          - { label: "Close button (screen readers) (EN)", name: ck_close_en, widget: string }
          - { label: "Footer link (HE)", name: ck_settings_link_he, widget: string }
          - { label: "Footer link (EN)", name: ck_settings_link_en, widget: string }
          - { label: "Bar: text (HE)", name: ck_bar_text_he, widget: text }
          - { label: "Bar: text (EN)", name: ck_bar_text_en, widget: text }
          - { label: "Bar: accept (HE)", name: ck_bar_accept_he, widget: string }
          - { label: "Bar: accept (EN)", name: ck_bar_accept_en, widget: string }
          - { label: "Bar: decline (HE)", name: ck_bar_reject_he, widget: string }
          - { label: "Bar: decline (EN)", name: ck_bar_reject_en, widget: string }
          - { label: "Bar: customize (HE)", name: ck_bar_customize_he, widget: string }
          - { label: "Bar: customize (EN)", name: ck_bar_customize_en, widget: string }
      # ------------------------------------------------------------------ FAQ
      - name: faq
        label: FAQ (also read by search engines & AI assistants)
        file: src/content/faq.json
        format: json
        fields:
          - { label: Show section on the site, name: show_section, widget: boolean, default: false, hint: "Tick when the questions are ready. Only shown questions are added to the structured data that search engines and AI assistants read." }
          - { label: Title (HE), name: title_he, widget: string }
          - { label: Title (EN), name: title_en, widget: string }
          - { label: Subtitle (HE), name: subtitle_he, widget: text, required: false }
          - { label: Subtitle (EN), name: subtitle_en, widget: text, required: false }
          - label: Questions
            name: items
            widget: list
            label_singular: Question
            summary: "{{fields.question_he}}"
            hint: "Write the questions a potential client would type into Google or ChatGPT, with short, specific answers (tools, timelines, results). English is optional; English visitors see the Hebrew if it is empty."
            fields:
              - { label: Question (HE), name: question_he, widget: string }
              - { label: Answer (HE), name: answer_he, widget: text }
              - { label: Question (EN), name: question_en, widget: string, required: false }
              - { label: Answer (EN), name: answer_en, widget: text, required: false }
      # ------------------------------------------------------------ About Me
      - name: about
        label: About Me
        file: src/content/about.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Catchphrase (EN), name: catchphrase_en, widget: string }
          - { label: Catchphrase (HE), name: catchphrase_he, widget: string }
          - { label: Headline (EN), name: headline_en, widget: string }
          - { label: Headline (HE), name: headline_he, widget: string }
          - { label: About text (EN), name: about_en, widget: text }
          - { label: About text (HE), name: about_he, widget: text }
          - { label: Short factual summary (EN), name: summary_en, widget: text, hint: "2-3 plain sentences: who you are, what you do, for whom and where. Not shown on the page; search engines and AI assistants read it (structured data and /llms.txt). Facts, not marketing language." }
          - { label: Short factual summary (HE), name: summary_he, widget: text, hint: "The same summary in Hebrew." }
          - { label: Profile image, name: profile_image, widget: image }
          - { label: LinkedIn URL, name: linkedin_url, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Location (EN), name: location_en, widget: string }
          - { label: Location (HE), name: location_he, widget: string }
          - label: Skill groups
            name: skills
            widget: list
            fields:
              - { label: Group title (EN), name: title_en, widget: string }
              - { label: Group title (HE), name: title_he, widget: string }
              - { label: Items, name: items, widget: list }

      # -------------------------------------------------------- Site Settings
      - name: settings
        label: Site Settings & Text
        file: src/content/settings.json
        format: json
        fields:
          - { label: SEO title (EN), name: site_title_en, widget: string }
          - { label: SEO title (HE), name: site_title_he, widget: string }
          - { label: SEO description (EN), name: site_description_en, widget: text }
          - { label: SEO description (HE), name: site_description_he, widget: text }
          - { label: Hero kicker (EN), name: hero_kicker_en, widget: string }
          - { label: Hero kicker (HE), name: hero_kicker_he, widget: string }
          - { label: Hero subheading (EN), name: hero_subheading_en, widget: text }
          - { label: Hero subheading (HE), name: hero_subheading_he, widget: text }
          - { label: Hero primary CTA (EN), name: hero_cta_primary_en, widget: string }
          - { label: Hero primary CTA (HE), name: hero_cta_primary_he, widget: string }
          - { label: Hero secondary CTA (EN), name: hero_cta_secondary_en, widget: string }
          - { label: Hero secondary CTA (HE), name: hero_cta_secondary_he, widget: string }
          - { label: Methodology title (EN), name: methodology_title_en, widget: string }
          - { label: Methodology title (HE), name: methodology_title_he, widget: string }
          - { label: Methodology subtitle (EN), name: methodology_subtitle_en, widget: string }
          - { label: Methodology subtitle (HE), name: methodology_subtitle_he, widget: string }
          - { label: Methodology step · Plan (EN), name: methodology_step_plan_en, widget: string }
          - { label: Methodology step · Plan (HE), name: methodology_step_plan_he, widget: string }
          - { label: Methodology step · Align (EN), name: methodology_step_align_en, widget: string }
          - { label: Methodology step · Align (HE), name: methodology_step_align_he, widget: string }
          - { label: Methodology step · Automate (EN), name: methodology_step_automate_en, widget: string }
          - { label: Methodology step · Automate (HE), name: methodology_step_automate_he, widget: string }
          - { label: Methodology step · Deliver (EN), name: methodology_step_deliver_en, widget: string }
          - { label: Methodology step · Deliver (HE), name: methodology_step_deliver_he, widget: string }
          - { label: Nav · About (EN), name: nav_about_en, widget: string }
          - { label: Nav · About (HE), name: nav_about_he, widget: string }
          - { label: Nav · Skills (EN), name: nav_skills_en, widget: string }
          - { label: Nav · Skills (HE), name: nav_skills_he, widget: string }
          - { label: Nav · Portfolio (EN), name: nav_portfolio_en, widget: string }
          - { label: Nav · Portfolio (HE), name: nav_portfolio_he, widget: string }
          - { label: Nav · Testimonials (EN), name: nav_testimonials_en, widget: string }
          - { label: Nav · Testimonials (HE), name: nav_testimonials_he, widget: string }
          - { label: Nav · Contact (EN), name: nav_contact_en, widget: string }
          - { label: Nav · Contact (HE), name: nav_contact_he, widget: string }
          - { label: About section title (EN), name: about_title_en, widget: string }
          - { label: About section title (HE), name: about_title_he, widget: string }
          - { label: Skills title (EN), name: skills_title_en, widget: string }
          - { label: Skills title (HE), name: skills_title_he, widget: string }
          - { label: Skills subtitle (EN), name: skills_subtitle_en, widget: text }
          - { label: Skills subtitle (HE), name: skills_subtitle_he, widget: text }
          - { label: Portfolio title (EN), name: portfolio_title_en, widget: string }
          - { label: Portfolio title (HE), name: portfolio_title_he, widget: string }
          - { label: Portfolio subtitle (EN), name: portfolio_subtitle_en, widget: text }
          - { label: Portfolio subtitle (HE), name: portfolio_subtitle_he, widget: text }
          - { label: Testimonials title (EN), name: testimonials_title_en, widget: string }
          - { label: Testimonials title (HE), name: testimonials_title_he, widget: string }
          - { label: Testimonials subtitle (EN), name: testimonials_subtitle_en, widget: text }
          - { label: Testimonials subtitle (HE), name: testimonials_subtitle_he, widget: text }
          - { label: Contact title (EN), name: contact_title_en, widget: string }
          - { label: Contact title (HE), name: contact_title_he, widget: string }
          - { label: Contact subtitle (EN), name: contact_subtitle_en, widget: text }
          - { label: Contact subtitle (HE), name: contact_subtitle_he, widget: text }
          - { label: Contact CTA (EN), name: contact_cta_en, widget: string }
          - { label: Contact CTA (HE), name: contact_cta_he, widget: string }
          - { label: Consultation booking link (Google Calendar), name: booking_url, widget: string, required: false, hint: "Your Google Calendar booking page link. In Google Calendar on a computer: Create, then Appointment schedule; after saving, open it and copy the booking page link. Leave empty to hide the booking buttons." }
          - { label: Booking button (HE), name: booking_label_he, widget: string }
          - { label: Booking button (EN), name: booking_label_en, widget: string }
          - { label: Booking note under the button (HE), name: booking_note_he, widget: string }
          - { label: Booking note under the button (EN), name: booking_note_en, widget: string }
          - { label: "First-task box: title (HE)", name: task_title_he, widget: string }
          - { label: "First-task box: title (EN)", name: task_title_en, widget: string }
          - { label: "First-task box: text (HE)", name: task_text_he, widget: text }
          - { label: "First-task box: text (EN)", name: task_text_en, widget: text }
          - { label: "First-task box: button (HE)", name: task_cta_he, widget: string, hint: "Opens the contact form." }
          - { label: "First-task box: button (EN)", name: task_cta_en, widget: string }
          - { label: "First-task box: point 1 (HE)", name: task_point1_he, widget: string, required: false, hint: "Short facts under the buttons, e.g. call length / free / no commitment. Leave a point empty to hide it." }
          - { label: "First-task box: point 1 (EN)", name: task_point1_en, widget: string, required: false }
          - { label: "First-task box: point 2 (HE)", name: task_point2_he, widget: string, required: false }
          - { label: "First-task box: point 2 (EN)", name: task_point2_en, widget: string, required: false }
          - { label: "First-task box: point 3 (HE)", name: task_point3_he, widget: string, required: false }
          - { label: "First-task box: point 3 (EN)", name: task_point3_en, widget: string, required: false }
          - { label: WhatsApp number for the contact form, name: whatsapp_number, widget: string, hint: "International format, digits only, no + or spaces. Israel example: 972544415871 (for 054-441-5871)." }
          - { label: Footer (EN), name: footer_en, widget: string }
          - { label: Footer (HE), name: footer_he, widget: string }

      # ----------------------------------------------------------- Privacy policy
      - name: privacy
        label: Privacy Policy
        file: src/content/privacy.json
        format: json
        fields:
          - { label: Title (EN), name: title_en, widget: string }
          - { label: Title (HE), name: title_he, widget: string }
          - { label: Intro (EN), name: intro_en, widget: text }
          - { label: Intro (HE), name: intro_he, widget: text }
          - { label: Last updated date, name: updated_date, widget: string, hint: "Update whenever the policy text changes. Format: YYYY-MM-DD." }
          - { label: Contact block title (EN), name: contact_title_en, widget: string }
          - { label: Contact block title (HE), name: contact_title_he, widget: string }
          - { label: Contact block intro (EN), name: contact_intro_en, widget: text }
          - { label: Contact block intro (HE), name: contact_intro_he, widget: text }
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.title_en}}"
            hint: "Each section is a numbered card. Keep the EN and HE lists the same length (same order)."
            fields:
              - { label: Section title (EN), name: title_en, widget: string }
              - { label: Section title (HE), name: title_he, widget: string }
              - { label: Paragraphs (EN), name: paragraphs_en, widget: list, required: false }
              - { label: Paragraphs (HE), name: paragraphs_he, widget: list, required: false }
              - { label: Bullet points (EN), name: bullets_en, widget: list, required: false }
              - { label: Bullet points (HE), name: bullets_he, widget: list, required: false }
              - { label: Closing paragraphs after bullets (EN), name: closing_en, widget: list, required: false }
              - { label: Closing paragraphs after bullets (HE), name: closing_he, widget: list, required: false }

      # --------------------------------------------------- Accessibility (IS 5568)
      - name: accessibility
        label: Accessibility Statement
        file: src/content/accessibility.json
        format: json
        fields:
          - { label: Title (EN), name: title_en, widget: string }
          - { label: Title (HE), name: title_he, widget: string }
          - { label: Intro (EN), name: intro_en, widget: text }
          - { label: Intro (HE), name: intro_he, widget: text }
          - { label: Compliance statement (EN), name: compliance_en, widget: text }
          - { label: Compliance statement (HE), name: compliance_he, widget: text }
          - { label: Measures taken (EN), name: measures_en, widget: list }
          - { label: Measures taken (HE), name: measures_he, widget: list }
          - { label: Known limitations (EN), name: limitations_en, widget: text }
          - { label: Known limitations (HE), name: limitations_he, widget: text }
          - { label: Coordinator section label (EN), name: coordinator_label_en, widget: string }
          - { label: Coordinator section label (HE), name: coordinator_label_he, widget: string }
          - { label: Coordinator name, name: coordinator_name, widget: string }
          - { label: Coordinator email, name: coordinator_email, widget: string }
          - { label: Coordinator phone, name: coordinator_phone, widget: string, required: false, hint: "Recommended for the Israeli accessibility statement." }
          - { label: Response note (EN), name: response_en, widget: text }
          - { label: Response note (HE), name: response_he, widget: text }
          - { label: 'Updated label (EN)', name: updated_label_en, widget: string }
          - { label: 'Updated label (HE)', name: updated_label_he, widget: string }
          - { label: Last updated date, name: updated_date, widget: string }
